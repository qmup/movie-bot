<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Cloudflare của streamc chặn request không có Referer; luôn gửi origin của trang này. -->
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Xem phim</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }
    /* Trong Mini App toàn màn hình (mobile), chừa vùng nút của Telegram và tai thỏ. */
    body.tg-mobile #stage {
      top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
      bottom: var(--tg-safe-area-inset-bottom, 0px);
      left: var(--tg-safe-area-inset-left, 0px);
      right: var(--tg-safe-area-inset-right, 0px);
    }
    #stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
    }
    .panel[hidden] { display: none; }
    .panel p {
      margin: 0;
      max-width: 26rem;
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.8;
    }
    .cta {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: #e50914;
      cursor: pointer;
    }
    .cta:hover { filter: brightness(1.1); }
    .cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    a { color: #8ec8ff; }

    #enter-fs {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    #enter-fs:hover, #enter-fs:focus-visible { opacity: 1; }
    #enter-fs[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div id="panel" class="panel">
    <p id="panel-text">Đang mở trình phát…</p>
  </div>

  <button id="enter-fs" type="button" title="Toàn màn hình" aria-label="Toàn màn hình" hidden>⛶</button>

  <script>
    (function () {
      var STREAMC_HOST = /(^|\.)streamc\.xyz$/i;
      var MOBILE_PLATFORMS = { ios: true, android: true, android_x: true };

      var stage = document.getElementById('stage');
      var panel = document.getElementById('panel');
      var panelText = document.getElementById('panel-text');
      var enterFsButton = document.getElementById('enter-fs');

      var target = resolveTarget(new URLSearchParams(window.location.search));
      if (!target) {
        showPanel('Link xem không hợp lệ. Hãy mở lại tập phim từ bot.');
        return;
      }

      var tg = window.Telegram && window.Telegram.WebApp;
      var inTelegram = Boolean(tg && tg.initData);

      if (inTelegram && MOBILE_PLATFORMS[tg.platform]) {
        startTelegramMobile(tg);
      } else if (inTelegram) {
        startTelegramDesktop(tg);
      } else {
        startBrowser();
      }

      function resolveTarget(params) {
        var hash = (params.get('h') || '').trim().toLowerCase();
        if (/^[a-f0-9]{16,64}$/.test(hash)) {
          return 'https://embed.streamc.xyz/embed.php?hash=' + hash;
        }
        try {
          var url = new URL((params.get('u') || '').trim());
          if ((url.protocol === 'https:' || url.protocol === 'http:') && STREAMC_HOST.test(url.hostname)) {
            return url.toString();
          }
        } catch (error) {
          // URL không hợp lệ
        }
        return null;
      }

      function mountPlayer() {
        var frame = document.createElement('iframe');
        frame.src = target;
        frame.referrerPolicy = 'origin';
        frame.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
        frame.allowFullscreen = true;
        frame.setAttribute('webkitallowfullscreen', '');
        frame.setAttribute('mozallowfullscreen', '');
        stage.appendChild(frame);
        return frame;
      }

      function showPanel(text, actionLabel, onAction) {
        panelText.textContent = text;
        var old = panel.querySelector('.cta');
        if (old) old.remove();
        if (actionLabel) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'cta';
          button.textContent = actionLabel;
          button.addEventListener('click', onAction);
          panel.appendChild(button);
          button.focus({ preventScroll: true });
        }
        panel.hidden = false;
      }

      function hidePanel() {
        panel.hidden = true;
      }

      function supports(version) {
        return typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(version);
      }

      // Mobile: Mini App toàn màn hình của Telegram, player phủ kín vùng an toàn.
      function startTelegramMobile() {
        document.body.classList.add('tg-mobile');
        tg.ready();
        tg.expand();
        if (supports('6.1')) {
          tg.setHeaderColor('#000000');
          tg.setBackgroundColor('#000000');
        }
        if (supports('7.7')) tg.disableVerticalSwipes();
        if (supports('8.0')) {
          tg.setBottomBarColor('#000000');
          tg.requestFullscreen();
        }
        mountPlayer();
        hidePanel();
      }

      // Desktop: phát ngay trong cửa sổ Mini App. Không dùng requestFullscreen của Telegram
      // vì nó làm player bị giãn hình và mất thanh điều khiển; toàn màn hình thật thì mở
      // trang này trong trình duyệt, nơi nút toàn màn hình của player hoạt động đúng.
      function startTelegramDesktop() {
        tg.ready();
        tg.expand();
        if (supports('6.1')) {
          tg.setHeaderColor('#000000');
          tg.setBackgroundColor('#000000');
        }
        var frame = mountPlayer();
        hidePanel();

        var browserUrl = window.location.origin + window.location.pathname + window.location.search;
        enterFsButton.title = 'Toàn màn hình (mở trong trình duyệt)';
        enterFsButton.setAttribute('aria-label', enterFsButton.title);
        enterFsButton.addEventListener('click', function () {
          tg.openLink(browserUrl);
          frame.remove();
          setTimeout(function () { tg.close(); }, 800);
        });
        enterFsButton.hidden = false;
      }

      // Trình duyệt: hiện player ngay; nút toàn màn hình của player dùng được bình thường.
      function startBrowser() {
        mountPlayer();
        hidePanel();

        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!request) return;

        function syncButton() {
          enterFsButton.hidden = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        }

        enterFsButton.addEventListener('click', function () {
          var result = request.call(root);
          if (result && typeof result.catch === 'function') result.catch(function () {});
        });
        document.addEventListener('fullscreenchange', syncButton);
        document.addEventListener('webkitfullscreenchange', syncButton);
        syncButton();
      }
    })();
  </script>
</body>
</html>
