<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Gửi Referer khi nhảy sang streamc — Cloudflare chặn request không có Referer. -->
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Đang mở phim…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121212;
      color: #f2f2f2;
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    a { color: #8ec8ff; }
    .hint { opacity: 0.75; font-size: 0.95rem; max-width: 28rem; line-height: 1.45; }
  </style>
</head>
<body>
  <p id="msg" class="hint">Đang mở trình phát…</p>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      var params = new URLSearchParams(window.location.search);
      var hash = (params.get('h') || '').trim().toLowerCase();
      var target = '';

      if (/^[a-f0-9]{16,64}$/.test(hash)) {
        target = 'https://embed.streamc.xyz/embed.php?hash=' + hash;
      } else {
        var raw = (params.get('u') || '').trim();
        try {
          var url = new URL(raw);
          if (url.protocol !== 'https:' && url.protocol !== 'http:') {
            throw new Error('protocol');
          }
          if (!/(^|\.)streamc\.xyz$/i.test(url.hostname)) {
            throw new Error('host');
          }
          target = url.toString();
        } catch (error) {
          msg.textContent = 'Link xem không hợp lệ.';
          return;
        }
      }

      var safeHref = target.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      msg.innerHTML = 'Nếu không tự mở, <a rel="noopener" href="' + safeHref + '">bấm vào đây</a>.';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
