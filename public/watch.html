<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Cloudflare của streamc chặn request không có Referer; luôn gửi origin của trang này. -->
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Xem phim</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }
    /* Mini App toàn màn hình trên mobile: chừa vùng nút của Telegram và tai thỏ. */
    body.tg-mobile #stage {
      top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
      bottom: var(--tg-safe-area-inset-bottom, 0px);
      left: var(--tg-safe-area-inset-left, 0px);
      right: var(--tg-safe-area-inset-right, 0px);
    }
    #stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script>
    (function () {
      var MOBILE_PLATFORMS = { ios: true, android: true, android_x: true };

      var target = resolveTarget(new URLSearchParams(window.location.search));
      if (!target) {
        var error = document.createElement('p');
        error.id = 'error';
        error.textContent = 'Link xem không hợp lệ. Hãy mở lại tập phim từ bot.';
        document.body.appendChild(error);
        return;
      }

      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initData) setUpTelegram(tg);
      mountPlayer(target);

      function resolveTarget(params) {
        var hash = (params.get('h') || '').trim().toLowerCase();
        if (/^[a-f0-9]{16,64}$/.test(hash)) {
          return 'https://embed.streamc.xyz/embed.php?hash=' + hash;
        }
        try {
          var url = new URL((params.get('u') || '').trim());
          if ((url.protocol === 'https:' || url.protocol === 'http:') && /(^|\.)streamc\.xyz$/i.test(url.hostname)) {
            return url.toString();
          }
        } catch (error) {
          // URL không hợp lệ
        }
        return null;
      }

      function mountPlayer(src) {
        var frame = document.createElement('iframe');
        frame.src = src;
        frame.referrerPolicy = 'origin';
        frame.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
        frame.allowFullscreen = true;
        frame.setAttribute('webkitallowfullscreen', '');
        document.getElementById('stage').appendChild(frame);
      }

      function setUpTelegram(app) {
        var mobile = Boolean(MOBILE_PLATFORMS[app.platform]);
        var canFullscreen = typeof app.isVersionAtLeast === 'function' && app.isVersionAtLeast('8.0');

        app.ready();
        app.expand();
        if (app.isVersionAtLeast('6.1')) {
          app.setHeaderColor('#000000');
          app.setBackgroundColor('#000000');
        }

        if (mobile) {
          document.body.classList.add('tg-mobile');
          if (app.isVersionAtLeast('7.7')) app.disableVerticalSwipes();
          if (canFullscreen) app.requestFullscreen();
          return;
        }

        if (!canFullscreen) return;

        // Desktop: Fullscreen API của player chỉ phủ kín cửa sổ Mini App,
        // nên phóng/thu cửa sổ Mini App theo trạng thái toàn màn hình của player.
        function playerIsFullscreen() {
          return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function onPlayerFullscreenChange() {
          if (playerIsFullscreen() && !app.isFullscreen) app.requestFullscreen();
          else if (!playerIsFullscreen() && app.isFullscreen) app.exitFullscreen();
        }

        document.addEventListener('fullscreenchange', onPlayerFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onPlayerFullscreenChange);

        // Thoát bằng Esc/nút của Telegram thì cũng đưa player ra khỏi toàn màn hình.
        app.onEvent('fullscreenChanged', function () {
          if (app.isFullscreen || !playerIsFullscreen()) return;
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          var result = exit && exit.call(document);
          if (result && typeof result.catch === 'function') result.catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
