<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Gửi Referer khi tải streamc — Cloudflare chặn request không có Referer. -->
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Xem phim</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #f2f2f2;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    #msg {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      opacity: 0.75;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    a { color: #8ec8ff; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <p id="msg">Đang mở trình phát…</p>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      var params = new URLSearchParams(window.location.search);
      var hash = (params.get('h') || '').trim().toLowerCase();
      var target = '';

      if (/^[a-f0-9]{16,64}$/.test(hash)) {
        target = 'https://embed.streamc.xyz/embed.php?hash=' + hash;
      } else {
        var raw = (params.get('u') || '').trim();
        try {
          var url = new URL(raw);
          if (url.protocol !== 'https:' && url.protocol !== 'http:') {
            throw new Error('protocol');
          }
          if (!/(^|\.)streamc\.xyz$/i.test(url.hostname)) {
            throw new Error('host');
          }
          target = url.toString();
        } catch (error) {
          msg.textContent = 'Link xem không hợp lệ.';
          return;
        }
      }

      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initData) {
        tg.ready();
        tg.expand();
        if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#000000');
        if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#000000');

        var frame = document.createElement('iframe');
        frame.src = target;
        frame.referrerPolicy = 'origin';
        frame.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
        frame.allowFullscreen = true;
        document.body.appendChild(frame);
        msg.remove();
        return;
      }

      var safeHref = target.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      msg.innerHTML = 'Nếu không tự mở, <a rel="noopener" href="' + safeHref + '">bấm vào đây</a>.';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
